spring.application.name=nutmeg

# PORT is what Render/Railway/Koyeb inject; 8080 locally
server.port=${PORT:8080}
server.shutdown=graceful
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024

# Vite puts a content hash in every asset filename, so a long cache is safe
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Game server
nutmeg.max-rooms=300
# "*" is fine because auth is a token in the first WS message, not a cookie.
# Lock down in prod if you like: NUTMEG_ALLOWED_ORIGINS=https://your-app.onrender.com
nutmeg.allowed-origins=${NUTMEG_ALLOWED_ORIGINS:*}

management.endpoints.web.exposure.include=health,info

logging.level.com.example.nutmeg=INFO
